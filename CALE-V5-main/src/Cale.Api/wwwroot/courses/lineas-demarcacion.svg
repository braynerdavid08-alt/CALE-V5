<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="800" height="600" role="img" aria-label="Cuatro vías vistas desde arriba, marcadas A, B, C y D, con distintas líneas en el centro">
  <rect width="400" height="300" fill="#d7e8c4"/>

  <g fill="#5a5d63">
    <rect x="40" y="8" width="352" height="62"/>
    <rect x="40" y="82" width="352" height="62"/>
    <rect x="40" y="156" width="352" height="62"/>
    <rect x="40" y="230" width="352" height="62"/>
  </g>

  <!-- Bordes de calzada -->
  <g stroke="#f4f4f4" stroke-width="2">
    <line x1="40" y1="11" x2="392" y2="11"/><line x1="40" y1="67" x2="392" y2="67"/>
    <line x1="40" y1="85" x2="392" y2="85"/><line x1="40" y1="141" x2="392" y2="141"/>
    <line x1="40" y1="159" x2="392" y2="159"/><line x1="40" y1="215" x2="392" y2="215"/>
    <line x1="40" y1="233" x2="392" y2="233"/><line x1="40" y1="289" x2="392" y2="289"/>
  </g>

  <!-- A: línea blanca discontinua, ambos carriles en el mismo sentido -->
  <line x1="40" y1="39" x2="392" y2="39" stroke="#ffffff" stroke-width="3" stroke-dasharray="16 12"/>
  <!-- B: línea amarilla continua -->
  <line x1="40" y1="113" x2="392" y2="113" stroke="#f2c230" stroke-width="3"/>
  <!-- C: doble línea amarilla continua -->
  <line x1="40" y1="184" x2="392" y2="184" stroke="#f2c230" stroke-width="3"/>
  <line x1="40" y1="190" x2="392" y2="190" stroke="#f2c230" stroke-width="3"/>
  <!-- D: línea mixta: continua arriba, discontinua abajo -->
  <line x1="40" y1="258" x2="392" y2="258" stroke="#f2c230" stroke-width="3"/>
  <line x1="40" y1="264" x2="392" y2="264" stroke="#f2c230" stroke-width="3" stroke-dasharray="16 12"/>

  <!-- Flechas de sentido -->
  <g fill="#ffffff" opacity="0.9">
    <polygon points="300,22 318,25 300,28"/><polygon points="300,50 318,53 300,56"/>
    <polygon points="318,96 300,99 318,102"/><polygon points="300,124 318,127 300,130"/>
    <polygon points="318,169 300,172 318,175"/><polygon points="300,199 318,202 300,205"/>
    <polygon points="318,242 300,245 318,248"/>
  </g>

  <!-- Carro en el carril inferior de la vía D, detrás de un camión -->
  <g>
    <rect x="120" y="268" width="36" height="17" rx="5" fill="#e04848"/>
    <rect x="146" y="271" width="8" height="11" rx="2" fill="#bfe0f7"/>
    <rect x="200" y="267" width="64" height="19" rx="3" fill="#e6a23c"/>
    <rect x="252" y="270" width="10" height="13" rx="2" fill="#bfe0f7"/>
  </g>

  <!-- Etiquetas -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="20" cy="39" r="14" fill="#2f6fb5"/><text x="20" y="46">A</text>
    <circle cx="20" cy="113" r="14" fill="#2f6fb5"/><text x="20" y="120">B</text>
    <circle cx="20" cy="187" r="14" fill="#2f6fb5"/><text x="20" y="194">C</text>
    <circle cx="20" cy="261" r="14" fill="#2f6fb5"/><text x="20" y="268">D</text>
  </g>
</svg>
