<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="800" height="600" role="img" aria-label="Vista desde arriba de un cruce de calles con andenes, un garaje, un hidrante, un paradero y una ciclorruta">
  <rect width="400" height="300" fill="#cfe6b4"/>

  <!-- Manzanas y edificios -->
  <rect x="8" y="8" width="142" height="98" rx="4" fill="#f2dcbb" stroke="#c7a57a" stroke-width="2"/>
  <rect x="20" y="22" width="26" height="20" rx="2" fill="#9cc7e6"/>
  <rect x="112" y="22" width="26" height="20" rx="2" fill="#9cc7e6"/>
  <rect x="60" y="72" width="40" height="34" fill="#8f9aa6" stroke="#6b7580" stroke-width="2"/>
  <g stroke="#6b7580" stroke-width="1.5">
    <line x1="60" y1="80" x2="100" y2="80"/>
    <line x1="60" y1="88" x2="100" y2="88"/>
    <line x1="60" y1="96" x2="100" y2="96"/>
  </g>

  <rect x="270" y="8" width="122" height="98" rx="4" fill="#e8d3e8" stroke="#b993b9" stroke-width="2"/>
  <rect x="284" y="24" width="24" height="20" rx="2" fill="#9cc7e6"/>
  <rect x="352" y="24" width="24" height="20" rx="2" fill="#9cc7e6"/>

  <rect x="8" y="222" width="142" height="70" rx="4" fill="#dfe7f2" stroke="#9fb0c7" stroke-width="2"/>
  <circle cx="40" cy="258" r="14" fill="#7fb36a"/>
  <circle cx="118" cy="258" r="14" fill="#7fb36a"/>

  <rect x="270" y="246" width="122" height="46" rx="4" fill="#f5e6b8" stroke="#ccb36f" stroke-width="2"/>

  <!-- Andenes -->
  <g fill="#d6d6d2">
    <rect x="0" y="106" width="400" height="14"/>
    <rect x="0" y="200" width="400" height="14"/>
    <rect x="156" y="0" width="14" height="300"/>
    <rect x="250" y="0" width="14" height="300"/>
  </g>
  <rect x="60" y="106" width="40" height="14" fill="#b9b9b4"/>

  <!-- Calzadas -->
  <g fill="#5a5d63">
    <rect x="0" y="120" width="400" height="80"/>
    <rect x="170" y="0" width="80" height="300"/>
  </g>

  <!-- Línea central -->
  <g stroke="#f2c230" stroke-width="2.5" stroke-dasharray="12 10">
    <line x1="0" y1="160" x2="146" y2="160"/>
    <line x1="274" y1="160" x2="400" y2="160"/>
    <line x1="210" y1="0" x2="210" y2="96"/>
    <line x1="210" y1="224" x2="210" y2="300"/>
  </g>

  <!-- Pasos peatonales -->
  <g fill="#f4f4f4">
    <rect x="150" y="124" width="16" height="6"/><rect x="150" y="136" width="16" height="6"/>
    <rect x="150" y="148" width="16" height="6"/><rect x="150" y="166" width="16" height="6"/>
    <rect x="150" y="178" width="16" height="6"/><rect x="150" y="190" width="16" height="6"/>
    <rect x="254" y="124" width="16" height="6"/><rect x="254" y="136" width="16" height="6"/>
    <rect x="254" y="148" width="16" height="6"/><rect x="254" y="166" width="16" height="6"/>
    <rect x="254" y="178" width="16" height="6"/><rect x="254" y="190" width="16" height="6"/>
    <rect x="174" y="100" width="6" height="16"/><rect x="186" y="100" width="6" height="16"/>
    <rect x="198" y="100" width="6" height="16"/><rect x="216" y="100" width="6" height="16"/>
    <rect x="228" y="100" width="6" height="16"/><rect x="240" y="100" width="6" height="16"/>
    <rect x="174" y="204" width="6" height="16"/><rect x="186" y="204" width="6" height="16"/>
    <rect x="198" y="204" width="6" height="16"/><rect x="216" y="204" width="6" height="16"/>
    <rect x="228" y="204" width="6" height="16"/><rect x="240" y="204" width="6" height="16"/>
  </g>

  <!-- Ciclorruta -->
  <rect x="172" y="0" width="16" height="96" fill="#3d9a4f"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.6">
    <circle cx="175" cy="50" r="4"/>
    <circle cx="185" cy="50" r="4"/>
    <polyline points="175,50 179,43 185,50 181,50 179,43"/>
  </g>

  <!-- Hidrante -->
  <g>
    <rect x="76" y="201" width="8" height="11" rx="2" fill="#d92b2b"/>
    <rect x="73" y="204" width="14" height="3" rx="1" fill="#b51f1f"/>
    <circle cx="80" cy="201" r="4" fill="#d92b2b"/>
  </g>

  <!-- Paradero de buses -->
  <rect x="300" y="198" width="60" height="3" fill="#f2c230"/>
  <rect x="300" y="216" width="56" height="20" rx="3" fill="#2f6fb5"/>
  <rect x="304" y="220" width="48" height="12" rx="2" fill="#cfe2f5"/>
  <line x1="366" y1="214" x2="366" y2="240" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="359" y="206" width="14" height="12" rx="2" fill="#2f6fb5"/>
  <rect x="362" y="209" width="8" height="5" rx="1" fill="#ffffff"/>

  <!-- Peatón sobre el andén -->
  <g>
    <circle cx="330" cy="110" r="3" fill="#3a3a3a"/>
    <rect x="328" y="113" width="4" height="6" rx="1.5" fill="#e0533d"/>
  </g>

  <!-- Vehículos circulando -->
  <g>
    <rect x="30" y="170" width="34" height="18" rx="5" fill="#e04848"/>
    <rect x="52" y="173" width="8" height="12" rx="2" fill="#bfe0f7"/>
  </g>
  <g>
    <rect x="218" y="230" width="18" height="34" rx="5" fill="#3f7fd1"/>
    <rect x="221" y="234" width="12" height="8" rx="2" fill="#bfe0f7"/>
  </g>
</svg>
