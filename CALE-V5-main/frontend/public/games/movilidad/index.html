phone:['Celular','Contestar o leer al manejar te distrae: el carro se desvía y no ves los peligros.','Silencia el celular antes de salir. Si es urgente, detente en un lugar seguro y devuelve la llamada al parar.','📱'],
signal:['Direccionales','Sin aviso los demás no saben qué harás y pueden chocar cuando cambias de carril.','Revisa espejos, activa la direccional con anticipación (Q izquierda, E derecha), espera y cambia con suavidad.','↔️'],
