<ui-theme-toggle />
<section class="auth">
  <div class="brand-side">
    <img class="brand-logo" [src]="brand.icon192" [alt]="brand.name" width="120" height="120" />
    <p class="brand-name">{{ brand.name }}</p>
    <p class="brand-slogan">{{ brand.slogan }}</p>
    <h1>Crea tu cuenta de instructor</h1>
    <p>Accede a grupos, preguntas, bancos y seguimiento de tus estudiantes.</p>
  </div>
  <div class="auth-card">
    <p class="eyebrow">Instructor</p>
    <h2>Crear cuenta</h2>
    <ui-error [message]="auth.error()" />
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        Nombre
        <input type="text" formControlName="name" autocomplete="name" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <span class="field-error">El nombre es obligatorio.</span>
        }
      </label>
      <label class="field">
        Correo
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="field-error">Ingresa un correo válido.</span>
        }
      </label>
      <label class="field">
        Contraseña
        <input type="password" formControlName="password" autocomplete="new-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="field-error">Mínimo 8 caracteres.</span>
        }
      </label>
      <ui-button type="submit" [loading]="auth.loading()">Crear instructor</ui-button>
    </form>
    <p class="hint">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Iniciar sesión</a>
    </p>
    <p class="hint signup-label">Otros registros</p>
    <div class="signup-options">
      <a class="signup-option" routerLink="/register">Crear estudiante</a>
      <a class="signup-option" routerLink="/register-school">Crear escuela</a>
    </div>
  </div>
</section>
