<section class="auth">
  <div class="brand-side">
    <p class="logo">CALE</p>
    <h1>Formación vial clara y profesional</h1>
    <p>Simulador, aula virtual y seguimiento en un mismo lugar.</p>
  </div>
  <div class="auth-card">
    <p class="eyebrow">Bienvenido</p>
    <h2>Iniciar sesión</h2>
    <p class="lead">Entra para continuar tu formación.</p>
    <ui-error [message]="auth.error()" />
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        Correo
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="field-error">Ingresa un correo válido.</span>
        }
      </label>
      <label class="field">
        Contraseña
        <input type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="field-error">Mínimo 8 caracteres.</span>
        }
      </label>
      <ui-button type="submit" [loading]="auth.loading()">Entrar</ui-button>
    </form>
    <p class="hint">
      ¿Aún no tienes cuenta?
      <a routerLink="/register">Crear cuenta de estudiante</a>
    </p>
  </div>
</section>
