services:
  cale:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Cale: "Data Source=/data/cale.db"
      Jwt__Key: "${CALE_JWT_KEY:-CALE-DOCKER-DEV-ONLY-CHANGE-ME-32CHARS-MIN}"
      Cors__Origins: "${CALE_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      ForwardedHeaders__Enabled: "true"
      Seed__DemoUsers: "${CALE_SEED_DEMO:-false}"
      Seed__Admin__Email: "${CALE_ADMIN_EMAIL:-}"
      Seed__Admin__Name: "${CALE_ADMIN_NAME:-}"
      Seed__Admin__Password: "${CALE_ADMIN_PASSWORD:-}"
      Seed__Admin__PurgeOthers: "${CALE_ADMIN_PURGE:-false}"
      Email__Enabled: "${CALE_EMAIL_ENABLED:-false}"
      Email__Smtp__Host: "${CALE_SMTP_HOST:-}"
      Email__Smtp__Port: "${CALE_SMTP_PORT:-587}"
      Email__Smtp__User: "${CALE_SMTP_USER:-}"
      Email__Smtp__Password: "${CALE_SMTP_PASSWORD:-}"
      Email__Smtp__UseSsl: "${CALE_SMTP_SSL:-true}"
      Email__From: "${CALE_EMAIL_FROM:-noreply@micale.app}"
    volumes:
      - cale-data:/data
      - cale-uploads:/app/wwwroot/uploads
    restart: unless-stopped

volumes:
  cale-data:
  cale-uploads:
