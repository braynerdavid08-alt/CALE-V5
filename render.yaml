# Mi CALE — Render Blueprint
# Dashboard → Blueprints → New Blueprint Instance → repo braynerdavid08-alt/CALE-V5
services:
  - type: web
    name: micale
    runtime: docker
    plan: free
    region: ohio
    branch: cursor/cale-v5-initial-import
    rootDir: CALE-V5-main
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health/live
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__Cale
        value: Data Source=/data/cale.db
      - key: ForwardedHeaders__Enabled
        value: "true"
      - key: Seed__DemoUsers
        value: "true"
      - key: Jwt__Key
        generateValue: true
