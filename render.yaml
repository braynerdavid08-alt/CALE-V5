# Render blueprint — deploy from repo root with Docker (Angular + .NET).
services:
  - type: web
    name: micale
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: UPLOADS_ROOT
        value: /app/wwwroot/uploads
    disk:
      name: micale-uploads
      mountPath: /app/wwwroot/uploads
      sizeGB: 10
