name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: CALE-V5-main

# Independent jobs: tournament / Angular keep running even if full unit suite fails.
# Failures are never ignored (no continue-on-error). The workflow is red if any required job fails.

jobs:
  api-build:
    name: A — API Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Cale.sln
      - name: Build API
        run: dotnet build src/Cale.Api/Cale.Api.csproj -c Release --no-restore
      - name: Upload API binaries
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: |
            CALE-V5-main/src/**/bin/Release/
            CALE-V5-main/tests/**/bin/Release/
          if-no-files-found: ignore
          retention-days: 1

  unit-tests:
    name: B — Unit Tests (full suite)
    runs-on: ubuntu-latest
    needs: [api-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/Cale.UnitTests/Cale.UnitTests.csproj
      - name: Unit tests
        run: >
          dotnet test tests/Cale.UnitTests/Cale.UnitTests.csproj
          -c Release
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults
      - name: Publish unit TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: CALE-V5-main/TestResults/
          if-no-files-found: ignore

  tournament-bracket:
    name: C — TournamentBracketTests
    runs-on: ubuntu-latest
    needs: [api-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/Cale.UnitTests/Cale.UnitTests.csproj
      - name: Bracket unit tests
        run: >
          dotnet test tests/Cale.UnitTests/Cale.UnitTests.csproj
          -c Release
          --filter "FullyQualifiedName~TournamentBracket"
          --logger "trx;LogFileName=bracket.trx"
          --results-directory TestResults
      - name: Publish bracket TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bracket-test-results
          path: CALE-V5-main/TestResults/
          if-no-files-found: ignore

  angular-build:
    name: D — Angular Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CALE-V5-main/frontend/package-lock.json
      - name: Install
        working-directory: CALE-V5-main/frontend
        run: npm ci
      - name: Production build
        working-directory: CALE-V5-main/frontend
        run: npx ng build --configuration=production

  tournament-competitive:
    name: E — Tournament smoke + phase2
    runs-on: ubuntu-latest
    needs: [api-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/Cale.UnitTests/Cale.UnitTests.csproj
      - name: Tournament integration tests
        run: >
          dotnet test tests/Cale.UnitTests/Cale.UnitTests.csproj
          -c Release
          --filter "FullyQualifiedName~Tournaments"
          --logger "trx;LogFileName=tournaments.trx"
          --results-directory TestResults
      - name: Publish tournament TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tournament-test-results
          path: CALE-V5-main/TestResults/
          if-no-files-found: ignore

  # Karma was restored in Fase 8.1 (rimraf/glob). Runs independently of API jobs.
  angular-unit:
    name: F — Angular unit tests (Karma)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CALE-V5-main/frontend/package-lock.json
      - name: Install
        working-directory: CALE-V5-main/frontend
        run: npm ci
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Karma unit tests
        working-directory: CALE-V5-main/frontend
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npx ng test --watch=false --browsers=ChromeHeadless --no-progress

  # Source/logic Playwright specs (no lab passwords, no demo accounts, no live server).
  playwright-logic:
    name: G — Playwright logic specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CALE-V5-main/frontend/package-lock.json
      - name: Install
        working-directory: CALE-V5-main/frontend
        run: npm ci
      - name: Install Chromium for Playwright
        working-directory: CALE-V5-main/frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright host + ranking logic
        working-directory: CALE-V5-main/frontend
        run: >
          npx playwright test
          e2e/tournament-host-angular.spec.ts
          e2e/ranking-simplified.spec.ts
          --project=chromium
