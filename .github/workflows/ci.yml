name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: CALE-V5-main

jobs:
  api:
    name: API build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Cale.sln

      - name: Build API
        run: dotnet build src/Cale.Api/Cale.Api.csproj -c Release --no-restore

      - name: Unit tests (full)
        run: >
          dotnet test tests/Cale.UnitTests/Cale.UnitTests.csproj
          -c Release --no-restore
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults

      - name: Tournament bracket filter (explicit)
        run: >
          dotnet test tests/Cale.UnitTests/Cale.UnitTests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~TournamentBracket"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: CALE-V5-main/TestResults/
          if-no-files-found: ignore

  frontend:
    name: Angular production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CALE-V5-main/frontend/package-lock.json

      - name: Install
        working-directory: CALE-V5-main/frontend
        run: npm ci

      - name: Production build
        working-directory: CALE-V5-main/frontend
        run: npx ng build --configuration=production

  tournament-integration:
    name: Tournament smoke + phase2 (CI-compatible)
    runs-on: ubuntu-latest
    needs: [api]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/Cale.UnitTests/Cale.UnitTests.csproj

      - name: Tournament integration tests
        run: >
          dotnet test tests/Cale.UnitTests/Cale.UnitTests.csproj
          -c Release
          --filter "FullyQualifiedName~Tournaments"
          --logger "trx;LogFileName=tournaments.trx"
          --results-directory TestResults

      - name: Publish tournament test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tournament-test-results
          path: CALE-V5-main/TestResults/
          if-no-files-found: ignore
